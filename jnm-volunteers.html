  <script>
    var VIEW = (function () {
      if (window.JNM_VOL_VIEW) return window.JNM_VOL_VIEW;
      var sp = new URLSearchParams(location.search);
      return sp.get('view') === 'roster' ? 'roster' : 'lookup';
    })();
    var DATA = null;
    var DATA_VERSION = '';
    var selected = null;
    var refreshBusy = false;
    var jsonpSeq = 0;

    var VolCache = (function () {
      var DB = 'jnm_vol_v1';
      var STORE = 'dataset';
      var META = 'meta';
      var DB_VERSION = 1;

      function openDb() {
        return new Promise(function (resolve, reject) {
          if (!window.indexedDB) {
            reject(new Error('no idb'));
            return;
          }
          var req = indexedDB.open(DB, DB_VERSION);
          req.onupgradeneeded = function (e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
            if (!db.objectStoreNames.contains(META)) db.createObjectStore(META);
          };
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        });
      }

      function load(view) {
        if (!window.indexedDB) return Promise.resolve(null);
        return openDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(STORE, 'readonly');
            var req = tx.objectStore(STORE).get(String(view));
            req.onsuccess = function () { resolve(req.result || null); };
            req.onerror = function () { reject(req.error); };
          });
        }).catch(function () { return null; });
      }

      function save(view, dataVersion, payload) {
        if (!window.indexedDB || !payload) return Promise.resolve();
        return openDb().then(function (db) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction([STORE, META], 'readwrite');
            tx.objectStore(STORE).put({
              savedAt: Date.now(),
              dataVersion: String(dataVersion || ''),
              payload: payload,
            }, String(view));
            tx.objectStore(META).put(String(dataVersion || ''), String(view) + '_ver');
            tx.oncomplete = function () { resolve(); };
            tx.onerror = function () { reject(tx.error); };
          });
        }).catch(function () {});
      }

      return { load: load, save: save };
    })();

    function setAppReady(ready, msg) {
      document.body.classList.toggle('data-loading', !ready);
      var overlay = document.getElementById('loadingOverlay');
      overlay.classList.toggle('show', !ready);
      overlay.setAttribute('aria-busy', ready ? 'false' : 'true');
      if (msg) document.getElementById('loadingOverlayText').textContent = msg;
      var q = document.getElementById('q');
      if (q) q.disabled = !ready;
      ['leadSelect', 'tcSelect', 'areaSelect', 'groupSelect',
       'leadInput', 'tcInput', 'areaInput', 'groupInput'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.disabled = !ready;
      });
      var clearBtn = document.getElementById('clearFilters');
      if (clearBtn) clearBtn.disabled = !ready;
      var refreshBtn = document.getElementById('refreshData');
      if (refreshBtn && !refreshBusy) refreshBtn.disabled = !ready;
      notifyParentHeight();
    }

    function notifyParentHeight() {
      try {
        if (window.parent === window) return;
        var h = Math.ceil(Math.max(
          document.documentElement.scrollHeight || 0,
          document.body.scrollHeight || 0,
          document.documentElement.offsetHeight || 0
        ));
        if (h < 640) h = 640;
        window.parent.postMessage({ type: 'jnmVolHeight', height: h }, '*');
      } catch (e) {}
    }

    function gasRun(action, params, cb) {
      google.script.run.withSuccessHandler(cb).withFailureHandler(function (err) {
        cb({ ok: false, error: String(err) });
      }).api(action, params);
    }

    function run(action, params, cb) {
      if (DATA && (action === 'lookupSuggest' || action === 'lookup' ||
          action === 'rosterSuggest' || action === 'roster')) {
        if (action === 'lookupSuggest') {
          if (!lookupQueryOk(params.query)) { cb({ ok: true, hits: [] }); return; }
          cb({
            ok: true,
            hits: suggestLocal(DATA.lookupPeople, params.query).slice(0, 8).map(function (p) {
              var h = { name: p.name, phone: p.phone, email: p.email, norm: p.norm };
              if (p.phone && p.phone.length >= 4) h.phoneHint = p.phone.slice(-4);
              return h;
            }),
          });
          return;
        }
        if (action === 'rosterSuggest') {
          cb({ ok: true, hits: suggestLocal(DATA.leadPeople, params.query) });
          return;
        }
        if (action === 'lookup') { cb(lookupLocal(params)); return; }
        if (action === 'roster') { cb(rosterLocal(params)); return; }
      }
      if (!isGas()) {
        if (action === 'bootstrap') {
          cb({ ok: true, appVersion: DATA && DATA.appVersion, dataVersion: DATA && DATA.dataVersion });
          return;
        }
        if (action === 'dataset') {
          cb(DATA);
          return;
        }
        cb({ ok: false, error: 'Not loaded' });
        return;
      }
      gasRun(action, params, cb);
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]);
      });
    }
    function sheetUpdatedIso(payload) {
      if (payload && payload.sheetUpdated) return payload.sheetUpdated;
      var ver = String((payload && payload.dataVersion) || '');
      var i = ver.lastIndexOf('|');
      if (i >= 0) {
        var n = Number(ver.slice(i + 1));
        if (n) return new Date(n).toISOString();
      }
      return '';
    }
    function fmtSheetStamp(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleString('en-US', {
        timeZone: 'America/Los_Angeles',
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      }) + ' PT';
    }
    function setSheetStamp(payload) {
      var el = document.getElementById('sheetStamp');
      if (!el) return;
      var label = fmtSheetStamp(sheetUpdatedIso(payload));
      el.textContent = label ? ('Sheet ' + label) : '';
    }
    function fmtPhone(p) {
      var d = phoneDigits10(p);
      if (d) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
      return p || '';
    }
    function phoneDigits(raw) {
      return String(raw || '').replace(/\D/g, '');
    }
    function phoneDigits10(p) {
      var d = phoneDigits(p);
      if (d.length === 11 && d.charAt(0) === '1') d = d.slice(1);
      return d.length === 10 ? d : '';
    }
    function telHref(p) {
      var digits = phoneDigits(p);
      if (!digits) return '';
      if (digits.length === 10) return 'tel:+1' + digits;
      if (digits.length === 11 && digits.charAt(0) === '1') return 'tel:+' + digits;
      return '';
    }
    function whatsappHref(p) {
      var digits = phoneDigits(p);
      if (!digits) return '';
      if (digits.length === 10) digits = '1' + digits;
      else if (!(digits.length === 11 && digits.charAt(0) === '1')) return '';
      return 'https://wa.me/' + digits;
    }
    function copyContact(text, label) {
      var status = document.getElementById('status');
      if (!text) return;
      function done(msg) { if (status) { status.className = 'status'; status.textContent = msg; } }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          done((label || 'Value') + ' copied.');
        }).catch(function () { done('Copy: ' + text); });
      } else {
        done('Copy: ' + text);
      }
    }
    function phoneLinksHtml(phone) {
      var d = phoneDigits10(phone);
      if (!d) return '—';
      var shown = fmtPhone(d);
      var tel = telHref(d);
      var wa = whatsappHref(d);
      return '<span class="phone-cell">' +
        '<a class="phone-num" href="' + esc(tel) + '" title="Call ' + esc(shown) + '">' + esc(shown) + '</a>' +
        '<span class="contact-actions">' +
        '<a class="contact-link" href="' + esc(tel) + '" title="Call ' + esc(shown) + '">Call</a>' +
        '<a class="contact-link contact-link--wa" href="' + esc(wa) +
        '" target="_blank" rel="noopener noreferrer" title="WhatsApp ' + esc(shown) + '">WA</a>' +
        '<button type="button" class="contact-copy" data-copy="' + esc(shown) +
        '" data-copy-label="Phone" title="Copy phone">Copy</button>' +
        '</span></span>';
    }
    function bindContactCopy(root) {
      if (!root || root.getAttribute('data-copy-bound')) return;
      root.setAttribute('data-copy-bound', '1');
      root.addEventListener('click', function (e) {
        var link = e.target.closest && e.target.closest('.phone-cell a, .contact-link, .phone-act, .phone-num');
        if (link) e.stopPropagation();
        var btn = e.target.closest && e.target.closest('.contact-copy');
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        copyContact(btn.getAttribute('data-copy'), btn.getAttribute('data-copy-label'));
      }, true);
    }
    function isGas() {
      return !!(window.google && google.script && google.script.run);
    }
    function normalize(s) {
      return String(s || '').toLowerCase().replace(/\b(prabhuji|prabhu|mataji|prb|mtj|dasa|dasi|das|dd|ji)\b/g, ' ')
        .replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
    }
    function personMatches(p, qRaw) {
      var q = String(qRaw || '').trim().toLowerCase();
      if (!q) return false;
      var ph = phoneDigits10(qRaw);
      if (ph && p.phone === ph) return true;
      if (VIEW !== 'lookup' && p.email && p.email.indexOf(q) >= 0) return true;
      var nq = normalize(q);
      if (nq && p.norm && p.norm.indexOf(nq) >= 0) return true;
      var tokens = nq.split(' ').filter(Boolean);
      if (tokens.length > 1 && p.norm) return tokens.every(function (t) { return p.norm.indexOf(t) >= 0; });
      return false;
    }
    function suggestLocal(list, q) {
      return (list || []).filter(function (p) { return personMatches(p, q); }).slice(0, 12);
    }
    function asgById() {
      if (DATA && DATA._asgMap) return DATA._asgMap;
      var m = {};
      ((DATA && DATA.assignments) || []).forEach(function (a) { m[a.id] = a; });
      if (DATA) DATA._asgMap = m;
      return m;
    }
    function personKey(p) {
      return (p && (p.phone || p.email || p.norm)) || '';
    }
    function fieldNorm(v) {
      return String(v || '').replace(/\s+/g, ' ').trim();
    }
    function rosterFilterState() {
      return {
        lead: document.getElementById('leadSelect').value,
        tc: document.getElementById('tcSelect').value,
        area: document.getElementById('areaSelect').value,
        group: document.getElementById('groupSelect').value,
      };
    }
    function assignmentHasPerson(a, field, key) {
      if (!key) return true;
      return (a[field] || []).some(function (p) { return personKey(p) === key; });
    }
    function assignmentMatches(a, f, skip) {
      if (skip !== 'group' && f.group && fieldNorm(a.grouping) !== f.group) return false;
      if (skip !== 'area' && f.area && fieldNorm(a.keyArea) !== f.area) return false;
      if (skip !== 'lead' && f.lead && !assignmentHasPerson(a, 'leads', f.lead)) return false;
      if (skip !== 'tc' && f.tc && !assignmentHasPerson(a, 'tc', f.tc)) return false;
      return true;
    }
    function matchingAssignments(skip) {
      var f = rosterFilterState();
      return ((DATA && DATA.assignments) || []).filter(function (a) {
        return assignmentMatches(a, f, skip);
      });
    }
    function uniquePeopleFromAsgs(asgs, field) {
      var seen = {};
      var out = [];
      asgs.forEach(function (a) {
        (a[field] || []).forEach(function (p) {
          var k = personKey(p);
          if (!k || seen[k]) return;
          seen[k] = true;
          out.push(p);
        });
      });
      out.sort(function (a, b) {
        return String(a.name || '').localeCompare(String(b.name || ''));
      });
      return out;
    }
    function uniqueFieldFromAsgs(asgs, field) {
      var seen = {};
      var out = [];
      asgs.forEach(function (a) {
        var s = fieldNorm(a[field]);
        if (!s) return;
        var k = s.toLowerCase();
        if (seen[k]) return;
        seen[k] = true;
        out.push(s);
      });
      out.sort(function (a, b) { return a.localeCompare(b); });
      return out;
    }
    function fillSelect(sel, people, allLabel, autoIfOne) {
      var prev = sel.value;
      var sig = people.map(personKey).sort().join('\n');
      var sameSet = sel.getAttribute('data-opt-sig') === sig;
      sel.innerHTML = '<option value="">' + esc(allLabel) + '</option>' + people.map(function (p) {
        return '<option value="' + esc(personKey(p)) + '">' + esc(p.name) + '</option>';
      }).join('');
      sel.setAttribute('data-opt-sig', sig);
      if (prev && Array.prototype.some.call(sel.options, function (o) { return o.value === prev; })) {
        sel.value = prev;
      } else if (autoIfOne && people.length === 1 && !sameSet) {
        sel.value = personKey(people[0]);
      }
    }
    function fillValueSelect(sel, values, allLabel) {
      var prev = sel.value;
      sel.innerHTML = '<option value="">' + esc(allLabel) + '</option>' + values.map(function (v) {
        return '<option value="' + esc(v) + '">' + esc(v) + '</option>';
      }).join('');
      if (prev && Array.prototype.some.call(sel.options, function (o) { return o.value === prev; })) {
        sel.value = prev;
      }
    }
    function comboParts(sel) {
      var id = sel.id.replace(/Select$/, '');
      return {
        sel: sel,
        input: document.getElementById(id + 'Input'),
        menu: document.getElementById(id + 'Menu')
      };
    }
    function syncComboFromSelect(sel) {
      var p = comboParts(sel);
      if (!p.input) return;
      var opt = sel.options[sel.selectedIndex];
      p.input.value = sel.value ? (opt ? opt.text : '') : '';
      if (sel.options[0]) p.input.placeholder = sel.options[0].text + ' — type to search';
    }
    function closeComboMenu(menu, input) {
      if (menu) menu.hidden = true;
      if (input) input.setAttribute('aria-expanded', 'false');
    }
    function closeAllComboMenus() {
      ['group', 'area', 'lead', 'tc'].forEach(function (id) {
        closeComboMenu(document.getElementById(id + 'Menu'), document.getElementById(id + 'Input'));
      });
    }
    function comboMatch(text, q) {
      q = String(q || '').trim().toLowerCase();
      if (!q) return true;
      var t = String(text || '').toLowerCase();
      if (t.indexOf(q) >= 0) return true;
      return q.split(/\s+/).every(function (tok) { return tok && t.indexOf(tok) >= 0; });
    }
    function comboSelectedText(sel) {
      if (!sel.value) return '';
      var opt = sel.options[sel.selectedIndex];
      return opt ? opt.text : '';
    }
    function renderComboMenu(sel, query) {
      var p = comboParts(sel);
      if (!p.menu) return;
      var filterQ = query;
      if (filterQ === comboSelectedText(sel)) filterQ = '';
      var allLabel = sel.options[0] ? sel.options[0].text : 'All';
      var matches = [];
      Array.prototype.forEach.call(sel.options, function (opt, i) {
        if (i === 0) return;
        if (comboMatch(opt.text, filterQ)) matches.push(opt);
      });
      var html = '<button type="button" role="option" data-value="">' + esc(allLabel) + '</button>';
      html += matches.map(function (opt) {
        var on = opt.value === sel.value ? ' active' : '';
        return '<button type="button" role="option" class="' + on + '" data-value="' +
          esc(opt.value) + '">' + esc(opt.text) + '</button>';
      }).join('');
      if (filterQ && !matches.length) {
        html += '<div class="combo-empty">No matches for “' + esc(filterQ) + '”</div>';
      }
      p.menu.innerHTML = html;
      p.menu.hidden = false;
      p.input.setAttribute('aria-expanded', 'true');
    }
    function pickComboOption(sel, value) {
      var p = comboParts(sel);
      sel.value = value || '';
      syncComboFromSelect(sel);
      closeComboMenu(p.menu, p.input);
      applyRosterFilter();
    }
    function bindCombo(sel) {
      var p = comboParts(sel);
      if (!p.input || !p.menu || p.input.getAttribute('data-combo-bound')) return;
      p.input.setAttribute('data-combo-bound', '1');
      p.input.setAttribute('aria-expanded', 'false');
      p.input.addEventListener('focus', function () { renderComboMenu(sel, p.input.value); });
      p.input.addEventListener('click', function () { renderComboMenu(sel, p.input.value); });
      p.input.addEventListener('input', function () { renderComboMenu(sel, p.input.value); });
      p.input.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          e.preventDefault();
          syncComboFromSelect(sel);
          closeComboMenu(p.menu, p.input);
          p.input.blur();
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          var q = String(p.input.value || '').trim();
          if (!q) { pickComboOption(sel, ''); return; }
          var buttons = p.menu.querySelectorAll('button[data-value]');
          var hit = null;
          Array.prototype.forEach.call(buttons, function (btn) {
            if (!btn.getAttribute('data-value')) return;
            if (!hit) hit = btn;
            if (btn.getAttribute('data-value') === sel.value) hit = btn;
          });
          var exact = null;
          Array.prototype.forEach.call(sel.options, function (opt, i) {
            if (i && opt.text.toLowerCase() === q.toLowerCase()) exact = opt.value;
          });
          if (exact != null) pickComboOption(sel, exact);
          else if (hit) pickComboOption(sel, hit.getAttribute('data-value'));
        }
      });
      p.menu.addEventListener('mousedown', function (e) {
        var btn = e.target.closest('button[data-value]');
        if (!btn) return;
        e.preventDefault();
        pickComboOption(sel, btn.getAttribute('data-value'));
      });
      p.input.addEventListener('blur', function () {
        setTimeout(function () {
          if (p.menu.hidden) return;
          closeComboMenu(p.menu, p.input);
          syncComboFromSelect(sel);
        }, 150);
      });
    }
    function fillRosterDropdowns() {
      var guard = 0;
      while (guard++ < 5) {
        var before = rosterFilterState();
        fillValueSelect(document.getElementById('groupSelect'), uniqueFieldFromAsgs(matchingAssignments('group'), 'grouping'), 'All groupings');
        fillValueSelect(document.getElementById('areaSelect'), uniqueFieldFromAsgs(matchingAssignments('area'), 'keyArea'), 'All key areas');
        fillSelect(document.getElementById('leadSelect'), uniquePeopleFromAsgs(matchingAssignments('lead'), 'leads'), 'All area leads', true);
        fillSelect(document.getElementById('tcSelect'), uniquePeopleFromAsgs(matchingAssignments('tc'), 'tc'), 'All TC incharge', true);
        var after = rosterFilterState();
        if (before.lead === after.lead && before.tc === after.tc &&
            before.area === after.area && before.group === after.group) break;
      }
      ['groupSelect', 'areaSelect', 'leadSelect', 'tcSelect'].forEach(function (id) {
        syncComboFromSelect(document.getElementById(id));
      });
    }
    function rosterFromDropdowns() {
      var f = rosterFilterState();
      var assignments = matchingAssignments(null);
      assignments.sort(rosterSort);
      return { ok: true, assignments: assignments, filtered: !!(f.lead || f.tc || f.area || f.group) };
    }
    function lookupQueryOk(q) {
      if (phoneDigits10(q)) return true;
      var nq = normalize(q).replace(/[0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
      return nq.length >= 3;
    }
    function lookupLocal(params) {
      if (!lookupQueryOk(params.query)) return { ok: true, rows: [] };
      var people = suggestLocal(DATA.lookupPeople, params.query);
      var map = asgById();
      var rows = [];
      people.forEach(function (p) {
        var assignments = (p.assignmentIds || []).map(function (id) { return map[id]; }).filter(Boolean);
        assignments.sort(function (a, b) { return (a.daySort - b.daySort) || (a.slotSort - b.slotSort); });
        assignments.forEach(function (a) {
          rows.push({
            volunteerName: p.name,
            volunteerPhone: p.phone || '',
            date: a.day || '',
            slot: a.slot || '',
            keyArea: a.keyArea || '',
            grouping: a.grouping || '',
            areaLead: (a.leads || []).map(function (x) { return x.name; }).filter(Boolean).join(', '),
            areaLeads: a.leads || [],
          });
        });
      });
      return { ok: true, rows: rows.slice(0, 40) };
    }
    function rosterLocal(params) {

    function rosterDayRank(a) {
      var day = String(a && a.day || '').replace(/\s+/g, ' ').trim().toLowerCase();
      if (a.daySort === 20260904) return 0;
      if (day.indexOf('sep 3 & 4') >= 0 || day.indexOf('sep 3 and 4') >= 0) return 1;
      if (a.daySort === 20260905) return 2;
      return 100 + (Number(a.daySort) || 0);

    function rosterSort(a, b) {
      var ra = rosterDayRank(a);

      if (ra !== rb) return ra - rb;

        String(a.keyArea || '').localeCompare(String(b.keyArea || ''));

    function uniquePeopleKeys(assignments, field) {
      var seen = {};
      (assignments || []).forEach(function (a) {
        (a[field] || []).forEach(function (p) {

          if (k) seen[k] = true;

    function uniqueAreaCount(assignments) {
      var seen = {};

    function computeRosterStats(assignments) {
      var list = assignments || [];
      var t1 = uniquePeopleKeys(list, 'tier1');
      var t2 = uniquePeopleKeys(list, 'tier2');
      var t3 = uniquePeopleKeys(list, 'tier3');
      var vol = {};
      t1.concat(t2, t3).forEach(function (k) { vol[k] = true; });
      var groups = [];
      list.slice().sort(rosterSort).forEach(function (a) {
        var last = groups[groups.length - 1];
        if (!last || last.day !== a.day) groups.push({ day: a.day, rank: rosterDayRank(a), items: [a] });
        else last.items.push(a);
      });
      return {
        areas: uniqueAreaCount(list),
        shifts: list.length,
        volunteers: Object.keys(vol).length,
        tier1: t1.length,
        tier2: t2.length,
        tier3: t3.length,
        byDay: groups.map(function (g) {
          var gt1 = uniquePeopleKeys(g.items, 'tier1');
          var gt2 = uniquePeopleKeys(g.items, 'tier2');
          var gt3 = uniquePeopleKeys(g.items, 'tier3');
          var gvol = {};
          gt1.concat(gt2, gt3).forEach(function (k) { gvol[k] = true; });
          return {
            day: g.day || 'Date not set',
            rank: g.rank,
            areas: uniqueAreaCount(g.items),
            shifts: g.items.length,
            volunteers: Object.keys(gvol).length,
            tier1: gt1.length,
            tier2: gt2.length,
            tier3: gt3.length
          };
        })
      };
    }

    function metaLooksReliable(boot) {
      if (!boot) return false;

    function refreshFromSheet() {
      if (refreshBusy) return;
      var status = document.getElementById('status');
      status.className = 'status';
      status.textContent = 'Checking sheet…';
      setRefreshBusy(true);
      var finished = false;
      function doneOk(ds, msg) {
        if (finished) return;
        finished = true;
        setRefreshBusy(false);
        if (!ds || !ds.ok || !(ds.assignments || []).length) {
          status.className = 'status error';
          status.textContent = (ds && ds.error) || 'Could not refresh';
          return;
        }
        VolCache.save(VIEW, ds.dataVersion, ds);
        applyPayload(ds, false, msg || '');
      }
      function doneFail(err) {
        if (finished) return;
        finished = true;
        setRefreshBusy(false);
        status.className = 'status error';
        status.textContent = DATA
          ? 'Could not refresh; still showing the last loaded list.'
          : String(err || 'Could not refresh');
      }
      function alreadyCurrent(boot) {
        if (finished) return;
        finished = true;
        setRefreshBusy(false);
        if (boot) setSheetStamp(boot);
        status.className = 'status';
        status.textContent = 'Already up to date';
      }
      function fetchFull(force) {
        status.textContent = 'Reading the sheet…';
        if (isGas()) {
          var gasSettled = false;
          var gasTimer = setTimeout(function () {
            if (gasSettled || finished) return;
            gasSettled = true;
            tryJsonpRefresh({ force: !!force }, doneOk, doneFail);
          }, 25000);
          gasRun('dataset', { force: !!force }, function (ds) {
            if (gasSettled || finished) return;
            gasSettled = true;
            clearTimeout(gasTimer);
            if (ds && ds.ok && (ds.assignments || []).length) doneOk(ds);
            else tryJsonpRefresh({ force: !!force }, doneOk, doneFail);
          });
          return;
        }
        tryJsonpRefresh({ force: !!force }, doneOk, doneFail);
      }
      function afterMeta(boot) {
        if (finished) return;
        if (!boot || !boot.ok) {
          fetchFull(true);
          return;
        }
        if (metaLooksReliable(boot) && DATA &&
            String(DATA.dataVersion) === String(boot.dataVersion)) {
          alreadyCurrent(boot);
          return;
        }
        fetchFull(!metaLooksReliable(boot));
      }
      if (isGas()) {
        gasRun('bootstrap', {}, function (boot) {
          if (boot && boot.ok) afterMeta(boot);
          else tryJsonpRefresh({ kind: 'meta' }, afterMeta, function () { fetchFull(true); });
        });
        return;
      }
      if (window.JNM_VOL_JSONP_URL) {
        tryJsonpRefresh({ kind: 'meta' }, afterMeta, function () { fetchFull(true); });
        return;
      }
      doneFail('This preview does not read the live sheet.');
    }

            document.getElementById('status').className = 'status error';

    function loadJsonUrl(url, onErr) {
      fetch(url)
        .then(function (r) {

          return r.json();

        .then(function (payload) {
          if (!payload || !(payload.assignments || []).length) throw new Error('Empty dataset');
          payload.ok = true;

    function tryJsonpRefresh(opts, onOk, onFail) {
      if (typeof opts === 'function') {
        onFail = onOk;
        onOk = opts;
        opts = {};
      }
      opts = opts || {};
      var force = !!opts.force;
      var kind = String(opts.kind || '');
      var url = window.JNM_VOL_JSONP_URL;
      if (!url) {
        if (onFail) onFail('No live sheet URL');
        return;
      }
      jsonpSeq += 1;
      var seq = jsonpSeq;
      var cbName = 'jnmVolJsonp_' + seq;
      var settled = false;
      var timer = setTimeout(function () {
        if (settled || seq !== jsonpSeq) return;
        settled = true;
        try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
        if (onFail) onFail('Sheet refresh timed out');
      }, kind === 'meta' ? 15000 : 60000);
      window[cbName] = function (ds) {
        if (settled || seq !== jsonpSeq) return;
        settled = true;
        clearTimeout(timer);
        try { delete window[cbName]; } catch (e2) { window[cbName] = undefined; }
        if (!ds || !ds.ok) {
          if (onFail) onFail((ds && ds.error) || 'Empty dataset');
          return;
        }
        if (kind === 'meta') {
          if (onOk) onOk(ds);
          return;
        }
        if ((ds.assignments || []).length) {
          if (onOk) onOk(ds);
          else {
            VolCache.save(VIEW, ds.dataVersion || 'jsonp', ds);
            applyPayload(ds, false);
          }
        } else if (onFail) {
          onFail('Empty dataset');
        }
      };
      var extra = 'callback=' + encodeURIComponent(cbName);
      if (force) extra += '&force=1';
      if (kind) extra += '&kind=' + encodeURIComponent(kind);
      var s = document.createElement('script');
      s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + extra;
      s.async = true;
      s.referrerPolicy = 'no-referrer';
      s.onerror = function () {
        if (settled || seq !== jsonpSeq) return;
        settled = true;
        clearTimeout(timer);
        try { delete window[cbName]; } catch (e3) { window[cbName] = undefined; }
        if (onFail) onFail('Could not reach the sheet');
      };
      document.head.appendChild(s);
    }

    function start() {
      setAppReady(false, 'Loading assignments…');
      if (window.JNM_VOL_DATA_URL) {
        loadJsonUrl(window.JNM_VOL_DATA_URL, function (err) {
          setAppReady(false, 'Could not load volunteer list');
          document.getElementById('status').className = 'status error';
          document.getElementById('status').textContent = 'Could not load volunteer list. ' + err;
        });
        tryJsonpRefresh();
        return;
      }
      if (!isGas()) {
        loadJsonUrl('fixtures/assignments.json', function (err) {
          setAppReady(false, 'Local preview needs fixtures');
          document.getElementById('status').className = 'status error';
          document.getElementById('status').textContent = 'Local preview needs fixtures/assignments.json — run python3 parse_assignments.py --fixtures. ' + err;
        });
        return;
      }
      VolCache.load(VIEW).then(function (cached) {
        var payload = cached && cached.payload;
        var hadCache = !!(payload && (
          (payload.assignments && payload.assignments.length) ||
          (payload.lookupPeople && payload.lookupPeople.length)
        ));
        if (hadCache) applyPayload(payload, true);
        bootFromNetwork(hadCache, cached && cached.dataVersion);
      });
    }
    window.addEventListener('resize', notifyParentHeight);
    start();
    window.runVolContactTests = function () {
      var results = [];
      function assert(name, cond, detail) {
        results.push({ name: name, ok: !!cond, detail: detail || '' });
      }
      assert('tel 10-digit', telHref('669-600-1704') === 'tel:+16696001704', telHref('669-600-1704'));
      assert('tel +1 11-digit', telHref('16696001704') === 'tel:+16696001704', telHref('16696001704'));
      assert('tel rejects 9-digit', telHref('669600170') === '', telHref('669600170'));
      assert('wa 10-digit', whatsappHref('669-600-1704') === 'https://wa.me/16696001704', whatsappHref('669-600-1704'));
      assert('wa +1 11-digit', whatsappHref('16696001704') === 'https://wa.me/16696001704', whatsappHref('16696001704'));
      var html = phoneLinksHtml('408-338-5853');
      assert('lead html tel', html.indexOf('href="tel:+14083385853"') >= 0, html);
      assert('lead html wa', html.indexOf('href="https://wa.me/14083385853"') >= 0, html);
      assert('lead html Call', html.indexOf('>Call</a>') >= 0, html);
      assert('lead html WA', html.indexOf('>WA</a>') >= 0, html);
      assert('lead html copy', html.indexOf('contact-copy') >= 0, html);
      assert('empty phone', phoneLinksHtml('') === '—', phoneLinksHtml(''));
      return results;
    };
  </script>
</body>
