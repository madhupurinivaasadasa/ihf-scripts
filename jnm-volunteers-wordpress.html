    loading="eager"
    referrerpolicy="no-referrer"
    allow="clipboard-write"
  ></iframe>
</div>
<script>
(function () {
  function viewportH() {
    if (window.visualViewport && window.visualViewport.height) {
      return window.visualViewport.height;
    }
    return window.innerHeight;
  }
  function sizeFrame() {
    var frame = document.getElementById("jnmVolFrame");
    var bar = document.getElementById("jnmBar");
    var blank = document.getElementById("jnmBlank");
    if (!frame) return;
    var admin = document.body.classList.contains("admin-bar") ? 32 : 0;
    var h = Math.floor(viewportH() - admin);
    if (blank) {
      blank.style.height = h + "px";
      blank.style.width = "100%";
    }
    var barH = bar ? Math.ceil(bar.getBoundingClientRect().height) : 56;
    var frameH = h - barH;
    if (frameH < 160) frameH = 160;
    frame.style.width = "100%";
    frame.style.height = frameH + "px";
  }
  function sizeSoon() {
    sizeFrame();
    setTimeout(sizeFrame, 50);
    setTimeout(sizeFrame, 200);
    setTimeout(sizeFrame, 500);
  }
  window.addEventListener("load", sizeSoon);
  window.addEventListener("resize", sizeSoon);
  window.addEventListener("orientationchange", sizeSoon);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", sizeSoon);
  }
})();
</script>
